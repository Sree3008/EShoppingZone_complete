<div class="auth-page">
  <div class="auth-card card">
    <div class="fp-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
    </div>
    <h2>Forgot Password</h2>
    <p class="sub">Enter your email to receive a password reset link</p>

    <div *ngIf="!sent">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" [(ngModel)]="email" placeholder="you@example.com" (keyup.enter)="submit()" />
      </div>
      <div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>
      <button class="btn btn-primary full-btn" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </div>

    <div class="alert alert-success" *ngIf="sent">
      Reset link sent! Check your inbox for instructions.
    </div>

    <a routerLink="/login" class="back-link">&#8592; Back to Login</a>
  </div>
</div>
