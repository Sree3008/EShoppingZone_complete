<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
      </div>
      <span class="brand-name">ShopEase</span>
    </div>
    <div class="auth-hero">
      <h2>Welcome back!</h2>
      <p>Sign in to access your cart, orders, and exclusive deals.</p>
      <div class="auth-features">
        <div class="auth-feature">
          <span class="feat-icon">🚚</span>
          <span>Free delivery on orders above ₹999</span>
        </div>
        <div class="auth-feature">
          <span class="feat-icon">🔒</span>
          <span>Safe and secure payments</span>
        </div>
        <div class="auth-feature">
          <span class="feat-icon">🔄</span>
          <span>Hassle-free 7-day returns</span>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-box">
      <h3>Sign In</h3>
      <p class="auth-sub">Enter your credentials to continue</p>

      <div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" [(ngModel)]="username" name="username" placeholder="Enter your username" />
          </div>
        </div>

        <div class="form-group">
          <div class="password-label-row">
            <label>Password</label>
            <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary submit-btn" [disabled]="loading">
          <span *ngIf="loading" class="btn-spinner"></span>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <p class="auth-switch">
        New to ShopEase? <a routerLink="/register">Create an account</a>
      </p>
    </div>
  </div>
</div>
