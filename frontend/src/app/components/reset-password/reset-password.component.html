<div class="auth-page">
  <div class="auth-card card">
    <div class="rp-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>
    <h2>Reset Password</h2>
    <p class="sub">Enter your new password below</p>

    <div *ngIf="!success">
      <div class="alert alert-error" *ngIf="errorMsg && !token">{{ errorMsg }}</div>

      <div *ngIf="token">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" class="form-control" [(ngModel)]="newPassword" placeholder="At least 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" placeholder="Repeat your new password" (keyup.enter)="submit()" />
        </div>
        <div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>
        <button class="btn btn-primary full-btn" (click)="submit()" [disabled]="loading">
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </div>
    </div>

    <div *ngIf="success">
      <div class="alert alert-success">Your password has been reset successfully!</div>
      <a routerLink="/login" class="btn btn-primary full-btn" style="display:block; text-align:center; margin-top:8px;">Go to Login</a>
    </div>

    <a routerLink="/login" class="back-link">&#8592; Back to Login</a>
  </div>
</div>
