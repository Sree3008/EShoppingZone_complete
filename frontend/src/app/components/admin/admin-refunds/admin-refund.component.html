<div class="page-wrapper">
  <h1 class="page-title">Refund Management</h1>

  <div *ngIf="successMsg" class="success-banner">{{ successMsg }}</div>
  <div *ngIf="errorMsg" class="error-banner">{{ errorMsg }}</div>

  <div *ngIf="loading" class="loading-state"><div class="spinner"></div></div>

  <div *ngIf="!loading" class="card table-card">
    <table>
      <thead>
        <tr>
          <th>Refund ID</th>
          <th>Order ID</th>
          <th>Amount (₹)</th>
          <th>Reason</th>
          <th>Status</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let r of refunds">
          <tr>
            <td>#{{ r.id }}</td>
            <td>#{{ r.orderId }}</td>
            <td>₹{{ r.amount | number:'1.2-2' }}</td>
            <td>{{ r.reason || 'N/A' }}</td>
            <td><span class="badge" [ngClass]="statusBadgeClass(r.status)">{{ r.status }}</span></td>
            <td>{{ r.createdAt | date:'dd MMM yyyy' }}</td>
            <td class="action-cell">
              <button
                *ngIf="r.status === 'PENDING'"
                class="btn btn-approve"
                (click)="approve(r.id)"
              >Approve</button>
              <button
                *ngIf="r.status === 'PENDING' && !showRejectFormMap[r.id]"
                class="btn btn-reject"
                (click)="showRejectForm(r.id)"
              >Reject</button>
            </td>
          </tr>
          <tr *ngIf="showRejectFormMap[r.id]">
            <td colspan="7">
              <div class="inline-form">
                <textarea
                  [(ngModel)]="rejectReasonMap[r.id]"
                  placeholder="Enter rejection reason…"
                  rows="2"
                  class="reason-textarea"
                ></textarea>
                <button class="btn btn-reject" (click)="confirmReject(r.id)">Confirm Reject</button>
                <button class="btn btn-update" (click)="showRejectFormMap[r.id] = false">Cancel</button>
              </div>
            </td>
          </tr>
        </ng-container>
        <tr *ngIf="refunds.length === 0">
          <td colspan="7" class="empty-row">No pending refunds.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
